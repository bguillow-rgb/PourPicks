name: Deploy Pages

# Trigger on every push to main. Workflow-based deploy bypasses the
# legacy GitHub Pages build queue, which got stuck on first build for
# this brand-new repo.
#
# The workflow_run trigger is load-bearing, not a convenience. daily-content.yml
# commits with the default GITHUB_TOKEN, and GitHub refuses to fire `on: push`
# workflows for GITHUB_TOKEN pushes (its recursion guard). Without this, bot
# content commits never deploy -- they only reach the live site when carried by
# the next human push. That silently froze the site Aug 3-10 2026 with seven
# finished articles returning 404. Do not remove it.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Daily SEO content"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deploy; let in-progress runs finish before
# starting a new one so a fast-fire of commits doesn't pile up.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_run fires on *completion*, success or not. Only deploy if the
    # content run actually succeeded; push and manual runs are unconditional.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # The Astro site is pre-built and committed to /docs (the same
      # path the legacy build was using). No npm install required —
      # we're just serving static files.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
